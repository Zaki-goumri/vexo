site_name: vexo
site_description: A single-node, S3-compatible object store written in Go.
site_url: https://zaki-goumri.github.io/vexo/
repo_url: https://github.com/Zaki-goumri/vexo
repo_name: Zaki-goumri/vexo
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Guides:
      - Using the S3 API: s3-api.md
      - Web console: console.md
      - Users, keys and policies: iam.md
      - Lifecycle and tiering: lifecycle.md
  - Reference:
      - Console API: console-api.md
      - Architecture: architecture.md
